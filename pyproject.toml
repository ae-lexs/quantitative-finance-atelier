[project]
name = "quantitative-finance-atelier"
version = "0.1.0"
description = "Learning quantitative finance by doing, in a Docker-only workspace."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "statsmodels==0.14.4",
    "jupyterlab==4.3.0",
    "yfinance==1.8.0",
    "ipywidgets==8.1.9",
]

[tool.uv]
package = false   # a workspace of notebooks and scripts, not an installable package
